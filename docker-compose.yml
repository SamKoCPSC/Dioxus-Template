x-app-labels: &app-labels
  com.app.dev-environment: "true"
  com.app.dev-instance: "${APP_INSTANCE_ID:?APP_INSTANCE_ID is required}"
  com.app.dev-token: "${APP_INSTANCE_TOKEN:-configuration-only}"

x-development-image: &development-image
  image: "app-development:${APP_INSTANCE_ID:?APP_INSTANCE_ID is required}"

services:
  postgres:
    build:
      context: "${APP_WORKTREE:?APP_WORKTREE is required}/docker/postgres"
    labels: *app-labels
    ports:
      - target: 5432
        published: 0
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_local_pass
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  minio:
    <<: *development-image
    labels: *app-labels
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -eu;
        export MINIO_API_CORS_ALLOW_ORIGIN="$${MINIO_CORS_ORIGIN}";
        exec minio server /data --console-address ":9001"
    ports:
      - target: 9000
        published: "${APP_MINIO_PORT:-0}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 9001
        published: "${APP_MINIO_CONSOLE_PORT:-0}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      MINIO_ROOT_USER: app-local-key
      MINIO_ROOT_PASSWORD: app-local-secret
    env_file:
      - "${APP_RUNTIME_DIR:?APP_RUNTIME_DIR is required}/instance.env"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    <<: *development-image
    labels: *app-labels
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -eu;
        mc alias set local http://minio:9000 app-local-key app-local-secret;
        mc mb --ignore-existing local/app-media;
        mc anonymous set download local/app-media;
        echo "app-media bucket ready"

  mock-oauth:
    image: ghcr.io/navikt/mock-oauth2-server:latest@sha256:b538810afd589d42fbfb856c588c2065eaeed1dc528d6c532972048e67fc2aff
    labels: *app-labels
    ports:
      - target: 8080
        published: "${APP_MOCK_OAUTH_PORT:-0}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      LOG_LEVEL: info
      JAVA_TOOL_OPTIONS: "-XX:MaxRAM=96m -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=70"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/isalive || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-github-api:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    labels: *app-labels
    volumes:
      - type: bind
        source: "${APP_WORKTREE:?APP_WORKTREE is required}/docker/development/mock-github-api.conf"
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/isalive || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  schema-init:
    <<: *development-image
    labels: *app-labels
    user: "1000"
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    entrypoint: ["/bin/bash", "/workspace/docker/development/schema-init.sh"]
    env_file:
      - "${APP_RUNTIME_DIR:?APP_RUNTIME_DIR is required}/instance.env"
    volumes:
      - type: bind
        source: "${APP_WORKTREE:?APP_WORKTREE is required}"
        target: /workspace
        read_only: true

  app:
    <<: *development-image
    build:
      context: "${APP_WORKTREE:?APP_WORKTREE is required}"
      dockerfile: docker/development/Dockerfile
    labels: *app-labels
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mock-oauth:
        condition: service_healthy
      mock-github-api:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    working_dir: /workspace
    entrypoint: ["/bin/bash", "/workspace/docker/development/app-entrypoint.sh"]
    ports:
      - target: 8080
        published: "${APP_APPLICATION_PORT:-0}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      CARGO_HOME: /app-cargo
      CARGO_TARGET_DIR: /app-target
      CARGO_BUILD_JOBS: "${APP_CARGO_BUILD_JOBS:-8}"
      CARGO_PROFILE_DEV_CODEGEN_UNITS: "${APP_CARGO_PROFILE_DEV_CODEGEN_UNITS:-16}"
      CARGO_PROFILE_DEV_DEBUG: "${APP_CARGO_PROFILE_DEV_DEBUG:-0}"
      CARGO_PROFILE_DEV_INCREMENTAL: "${APP_CARGO_PROFILE_DEV_INCREMENTAL:-false}"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--threads=1"
      DIOXUS_SESSION_CACHE_DIR: /app-dioxus
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
    env_file:
      - "${APP_RUNTIME_DIR:?APP_RUNTIME_DIR is required}/instance.env"
    volumes:
      - type: bind
        source: "${APP_WORKTREE:?APP_WORKTREE is required}"
        target: /workspace
      - cargo-home:/app-cargo
      - cargo-target:/app-target
      - dioxus-cache:/app-dioxus
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s

volumes:
  postgres-data:
  minio-data:
  cargo-home:
  cargo-target:
  dioxus-cache:
