name: Publish image
on:
  workflow_dispatch:
    inputs:
      include_storage:
        description: Compile the optional S3/R2/MinIO adapter
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Image identity
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          INCLUDE_STORAGE: ${{ inputs.include_storage }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "$INCLUDE_STORAGE" = true ]; then
            echo 'features=storage-s3' >> "$GITHUB_OUTPUT"
            echo 'suffix=-storage' >> "$GITHUB_OUTPUT"
          else
            echo 'features=' >> "$GITHUB_OUTPUT"
            echo 'suffix=' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: APP_FEATURES=${{ steps.image.outputs.features }}
          tags: |
            ${{ steps.image.outputs.name }}:main${{ steps.image.outputs.suffix }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}${{ steps.image.outputs.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app-release${{ steps.image.outputs.suffix }}
          cache-to: type=gha,scope=app-release${{ steps.image.outputs.suffix }},mode=max
