name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: browser
          cache-bin: true
      - name: Install local build and browser tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config clang lld python3-venv
          python3 -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/python" -m pip install -r requirements-dev.txt
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
          echo "$RUNNER_TEMP/browser-venv/bin" >> "$GITHUB_PATH"
          if ! command -v dx >/dev/null || ! dx --version | grep -Fq '0.7.9'; then
            cargo install dioxus-cli --version 0.7.9 --locked --force
          fi
      - name: Exercise disposable local app
        run: python3 scripts/ci-browser.py --output "$RUNNER_TEMP/browser-artifacts"
      - name: Retain synthetic screenshots and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/browser-artifacts/*.png
            ${{ runner.temp }}/browser-artifacts/result.json
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm, server, storage]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: check-${{ matrix.target }}
      - if: matrix.target == 'wasm'
        run: cargo check --locked --target wasm32-unknown-unknown
      - if: matrix.target == 'server'
        run: cargo check --locked --no-default-features --features server
      - if: matrix.target == 'storage'
        run: cargo check --locked --no-default-features --features server,storage-s3
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --locked --no-default-features --features server -- -D warnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: test
      - name: PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client libpq-dev
          pg_config --bindir >> "$GITHUB_PATH"
      - name: Install task runner
        run: cargo install just --version 1.40.0 --locked
      - run: cargo test --locked --no-default-features --features server -- --test-threads=4
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - run: python3 -m unittest discover -s docker/codex-cloud -p 'test_*.py' -v
      - run: bash scripts/tests/test-isolated-dev-config.sh
      - run: bash scripts/tests/test-check-schema-plan.sh
      - run: bash -n scripts/*.sh docker/codex-cloud/*.sh docker/development/*.sh entrypoint.sh
  credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/check-tracked-secrets.sh
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: audit
          cache-bin: true
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: bash scripts/security-audit.sh
